name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Ensure Flathub remote
        shell: bash
        run: |
          flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Validate metadata
        shell: bash
        run: |
          set -euo pipefail
          appstreamcli validate --no-net data/com.a2way.ComposeDeck.metainfo.xml
          desktop-file-validate data/com.a2way.ComposeDeck.desktop
          flatpak-builder-lint manifest com.a2way.ComposeDeck.json

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.a2way.ComposeDeck.json
          bundle: ComposeDeck-x86_64.flatpak
          branch: stable
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
